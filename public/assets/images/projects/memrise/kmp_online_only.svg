<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc"><title id="title">The second KMP library after moving online-only</title><desc id="desc">The original shared domain included business logic, repositories, persistence, networking and data policies. Moving online-only reduced its role to an API layer.</desc><defs><linearGradient id="kotlin" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#009ADF"/><stop offset=".45" stop-color="#9864DB"/><stop offset=".75" stop-color="#EF6D76"/><stop offset="1" stop-color="#FF8A00"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#777E83"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="32" y="60" width="1136" height="790" rx="38" fill="#F5F7FA" stroke="#FF8A00" stroke-width="4" /><rect x="52" y="36" width="390" height="50" rx="9" fill="#FF8A00" stroke="#FF8A00" stroke-width="4" /><text x="247" y="70" font-size="28" font-weight="700" fill="#101820" text-anchor="middle">Before · shared domain</text><g transform="translate(1030 102) scale(0.72)"><path d="M0 0H100L50 50L100 100H0Z" fill="url(#kotlin)"/><path d="M0 0H50L0 50Z" fill="#009BDF"/></g><text x="600" y="139" font-size="39" font-weight="700" fill="#192631" text-anchor="middle">The second KMP library</text><rect x="375" y="192" width="450" height="95" rx="26" fill="#D7E8FA" stroke="#0879EF" stroke-width="4" /><text x="600" y="250.5" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">Business logic</text><path d="M600 287V327" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="375" y="337" width="450" height="95" rx="26" fill="#EDB4E0" stroke="#DB20AA" stroke-width="4" /><text x="600" y="395.5" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">Repositories</text><path d="M600 432V472" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="375" y="482" width="450" height="95" rx="26" fill="#F8DEC5" stroke="#FF8A00" stroke-width="4" /><text x="600" y="540.5" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">Data sources</text><path d="M600 577V612H300V652" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M600 612H900V652" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="115" y="662" width="370" height="90" rx="26" fill="#D7E8FA" stroke="#0879EF" stroke-width="4" /><text x="300" y="718" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">SQLite · persistence</text><rect x="715" y="662" width="370" height="90" rx="26" fill="#F8DEC5" stroke="#FF8A00" stroke-width="4" /><text x="900" y="718" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">Ktor · networking</text><text x="600" y="811" font-size="28" font-weight="400" fill="#59636B" text-anchor="middle">Sync strategies · data source policies · caching</text><path d="M600 850V991" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="365" y="893" width="470" height="50" rx="9" fill="#0879EF" stroke="#0879EF" stroke-width="4" /><text x="600" y="927" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Product moves online-only</text><rect x="32" y="1020" width="1136" height="465" rx="38" fill="#F5F7FA" stroke="#FF8A00" stroke-width="4" /><rect x="52" y="996" width="290" height="50" rx="9" fill="#FF8A00" stroke="#FF8A00" stroke-width="4" /><text x="197" y="1030" font-size="28" font-weight="700" fill="#101820" text-anchor="middle">After · API layer</text><g transform="translate(1030 1062) scale(0.72)"><path d="M0 0H100L50 50L100 100H0Z" fill="url(#kotlin)"/><path d="M0 0H50L0 50Z" fill="#009BDF"/></g><text x="600" y="1103" font-size="37" font-weight="700" fill="#192631" text-anchor="middle">A much narrower responsibility</text><rect x="300" y="1160" width="600" height="106" rx="26" fill="#F8DEC5" stroke="#FF8A00" stroke-width="4" /><text x="600" y="1224" font-size="31" font-weight="700" fill="#192631" text-anchor="middle">API layer</text><g opacity="0.38"><rect x="105" y="1320" width="310" height="78" rx="20" fill="#E8ECF0" stroke="#8D98A2" stroke-width="4" stroke-dasharray="9 7"/><text x="260" y="1369" font-size="28" font-weight="600" fill="#192631" text-anchor="middle">Persistence</text><rect x="445" y="1320" width="310" height="78" rx="20" fill="#E8ECF0" stroke="#8D98A2" stroke-width="4" stroke-dasharray="9 7"/><text x="600" y="1369" font-size="28" font-weight="600" fill="#192631" text-anchor="middle">Sync strategies</text><rect x="785" y="1320" width="310" height="78" rx="20" fill="#E8ECF0" stroke="#8D98A2" stroke-width="4" stroke-dasharray="9 7"/><text x="940" y="1369" font-size="28" font-weight="600" fill="#192631" text-anchor="middle">Caching policies</text></g><text x="600" y="1451" font-size="27" font-weight="400" fill="#59636B" text-anchor="middle">The original scope had changed. Library overhead remained.</text></g></svg>
