<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc"><title id="title">Retiring the API library while retaining MemLearning</title><desc id="desc">Before, both mobile apps used MemLearning and a shared API library. After a one-month AI-assisted migration, each mobile platform owns its API layer and MemLearning remains shared.</desc><defs><linearGradient id="kotlin" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#009ADF"/><stop offset=".45" stop-color="#9864DB"/><stop offset=".75" stop-color="#EF6D76"/><stop offset="1" stop-color="#FF8A00"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#777E83"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="32" y="60" width="1136" height="610" rx="38" fill="#F5F7FA" stroke="#FF8A00" stroke-width="4" /><rect x="52" y="36" width="440" height="50" rx="9" fill="#FF8A00" stroke="#FF8A00" stroke-width="4" /><text x="272" y="70" font-size="28" font-weight="700" fill="#101820" text-anchor="middle">Before · two KMP libraries</text><g transform="translate(245 133) scale(0.9166666666666666)" fill="#A4C439"><path d="M25 43A35 35 0 0 1 95 43Z"/><path d="M37 17L27 3M83 17L93 3" stroke="#A4C439" stroke-width="5" stroke-linecap="round"/><rect x="25" y="48" width="70" height="48" rx="6"/><rect x="7" y="48" width="13" height="47" rx="6"/><rect x="100" y="48" width="13" height="47" rx="6"/><rect x="37" y="90" width="14" height="29" rx="7"/><rect x="69" y="90" width="14" height="29" rx="7"/><circle cx="42" cy="29" r="3" fill="white"/><circle cx="78" cy="29" r="3" fill="white"/></g><text x="300" y="283" font-size="28" font-weight="700" fill="#192631" text-anchor="middle">Android</text><g transform="translate(845 133) scale(0.9166666666666666)" fill="#949694"><path d="M65 27C64 12 77 2 92 0C92 14 81 28 65 27ZM61 36C49 36 44 28 32 31C8 36 8 