ke-width="4" /><text x="600" y="752" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI-assisted migration · 1 month</text><rect x="32" y="858" width="1136" height="850" rx="38" fill="#F5F7FA" stroke="#FF8A00" stroke-width="4" /><rect x="52" y="834" width="400" height="50" rx="9" fill="#FF8A00" stroke="#FF8A00" stroke-width="4" /><text x="252" y="868" font-size="28" font-weight="700" fill="#101820" text-anchor="middle">After · one KMP library</text><rect x="72" y="955" width="1056" height="409" rx="32" fill="#F5F7FA" stroke="#0879EF" stroke-width="4" /><rect x="94" y="932" width="330" height="50" rx="9" fill="#0879EF" stroke="#0879EF" stroke-width="4" /><text x="259" y="966" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Platform-owned code</text><g transform="translate(270 1002) scale(0.8333333333333334)" fill="#A4C439"><path d="M25 43A35 35 0 0 1 95 43Z"/><path d="M37 17L27 3M83 17L93 3" stroke="#A4C439" stroke-width="5" stroke-linecap="round"/><rect x="25" y="48" width="70" height="48" rx="6"/><rect x="7" y="48" width="13" height="47" rx="6"/><rect x="100" y="48" width="13" height="47" rx="6"/><rect x="37" y="90" width="14" height="29" rx="7"/><rect x="69" y="90" width="14" height="29" rx="7"/><circle cx="42" cy="29" r="3" fill="white"/><circle cx="78" cy="29" r="3" fill="white"/></g><text x="320" y="1142" font-size="28" font-weight="700" fill="#192631" text-anchor="middle">Android</text><g transform="translate(830 1002) scale(0.8333333333333334)" fill="#949694"><path d="M65 27C64 12 77 2 92 0C92 14 81 28 65 27ZM61 36C49 36 44 28 32 31C8 36 8 65 18 88C25 104 33 120 45 119C54 119 57 113 66 113C76 113 79 119 89 118C102 116 114 93 116 85C96 76 91 52 112 40C102 28 89 27 77 31C70 33 65 36 61 36Z"/></g><text x="880" y="1142" font-size="28" font-weight="700" fill="#192631" text-anchor="middle">iOS</text><path d="M320 1157V1190" fill="none" stroke="#777E83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-e